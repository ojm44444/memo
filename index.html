<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.v2.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Dark by default (Owen, 29 Aug): the app no longer follows the OS, so
         the browser chrome matches the dark ground unless the user chose light. -->
    <meta name="theme-color" content="#16303b" />
    <script>
      // Before first paint: apply a stored light choice so there is no dark
      // flash for light users, and nothing else - dark is the default.
      try {
        if (localStorage.getItem('memo-theme') === 'light')
          document.documentElement.classList.add('light')
      } catch {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="songdrafts" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO -->
    <title>songdrafts · Finish more songs</title>
    <meta name="description" content="A board for your voice memos. Stack takes, drag songs right as they get better, send a demo link. Works offline. Nobody trains on your music." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="songdrafts · Finish more songs" />
    <meta property="og:description" content="A board for your voice memos. Stack takes, drag songs right as they get better, send a demo link. Works offline. Nobody trains on your music." />
    <meta property="og:url" content="https://www.songdrafts.com" />
    <meta property="og:image" content="https://www.songdrafts.com/og-card.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="songdrafts · Finish more songs" />
    <meta name="twitter:description" content="A board for your voice memos. Stack takes, drag songs right as they get better, send a demo link. Works offline. Nobody trains on your music." />
    <meta name="twitter:image" content="https://www.songdrafts.com/og-card.png" />

    <!-- No Meta pixel here, on purpose. One was added on 22 June 2026, loaded
         unconditionally on every route with no consent, and because this file
         is served for every URL it ran on /share/<token> and /invite/<token>
         too, sending the secret token in the page address to Meta. The pixel
         now lives in src/lib/metaPixel.ts: it loads only after "Allow", never
         on share, invite or playlist links, and never sends in-app page views.
         Do not put a pixel snippet back in this file. -->
    <!-- The two faces that paint the hero. Self-hosted, so nothing
         third-party blocks first paint. -->
    <link rel="canonical" href="https://www.songdrafts.com/" />
    <link rel="preload" href="/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
